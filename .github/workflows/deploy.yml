name: Deploy Angular to GitHub Pages (Official)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean and validate dependency tree
        run: |
          rm -rf node_modules

          if ! npm ci --prefer-offline; then
            echo "Lockfile out of sync with package.json — regenerating lockfile..."
            rm -f package-lock.json
            npm install --package-lock-only
            git diff --exit-code package-lock.json || echo "::warning::Lockfile was out of sync and was regenerated."
            npm ci --prefer-offline
          fi

      - name: Build Angular app
        run: |
          npm run build -- --configuration production --base-href "/artabrian-weekend-2025/"

      - name: Upload production build as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/artabrian-weekend-2025/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
