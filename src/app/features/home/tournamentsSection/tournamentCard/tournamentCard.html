<article
  class="relative flex flex-col overflow-hidden rounded-3xl min-h-[360px] h-full shadow-xl transition-transform bg-neutral-800 text-white"
>
  <ng-container *ngIf="data() as tournament">
    <!-- Imagen de fondo con carga diferida -->
    <img
      [src]="tournament.backgroundPath"
      alt="Imagen torneo {{ tournament.name }}"
      class="absolute inset-0 w-full h-full object-cover opacity-60"
      decoding="async"
    />

    <!-- Overlay para legibilidad -->
    <div
      class="absolute inset-0 bg-gradient-to-t from-black via-black/90 to-transparent pointer-events-none"
    ></div>

    <!-- Contenido -->
    <div class="relative z-10 p-6 flex flex-col gap-2">
      <h3
        class="text-3xl font-extrabold leading-snug uppercase tracking-wide text-white drop-shadow-lg"
      >
        {{ tournament.name }}
      </h3>
      <hr class="border-b-2 border-gray-300" />
      <div class="flex items-center space-x-3 text-lg text-gray-300 mb-2">
        <span class="text-xl font-semibold">{{ tournament.hour }}</span>
        <span class="ml-1 text-gray-300">·</span>
        <span class="text-amber-400 font-bold text-xl">
          Precio: {{ tournament.prize }}€
        </span>
      </div>
      <p
        *ngIf="tournament.details"
        class="text-neutral-300 text-base leading-relaxed line-clamp-3 mb-3"
      >
        {{ tournament.details }}
      </p>

      <div *ngIf="tournament.rewards.length">
        <h4
          class="text-xl text-gray-300 font-bold uppercase text-lg mb-2 tracking-wider drop-shadow-sm"
        >
          Premios
        </h4>
        <ul class="space-y-1 font-semibold">
          <li
            *ngFor="let reward of tournament.rewards"
            class="grid grid-cols-[auto,1fr] gap-x-3 items-baseline"
          >
            <span class="text-amber-400 whitespace-nowrap">
              {{ reward.standing }}:
            </span>
            <span class="break-words text-gray-300">
              {{ reward.description }}
            </span>
          </li>
        </ul>
      </div>
    </div>
  </ng-container>
</article>
